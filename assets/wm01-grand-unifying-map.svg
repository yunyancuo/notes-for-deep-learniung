<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="430" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 1：《西瓜书》16 章统一方程与四大核心构件全景图</text>

  <!-- Top Master Formula Banner -->
  <rect x="28" y="54" width="1024" height="64" rx="8" fill="#1E293B"/>
  <text x="540" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#F8FAFC">统帅全书的结构风险最小化 (SRM) 与最大后验 (MAP) 主方程：</text>
  <text x="540" y="104" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#38BDF8">f* = argmin_{f ∈ H} [ (1/N) Σ ℓ( f(x_i), y_i )  +  λ · Ω(f) ]   ⇔   argmax_θ [ Σ log P(y_i | x_i, θ) + log P(θ) ]</text>

  <!-- Pillar 1: Hypothesis Space H -->
  <rect x="28" y="134" width="244" height="272" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="150" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">1. 假设空间 H（f 长什么样）</text>
  <rect x="42" y="176" width="216" height="44" rx="5" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="52" y="194" font-size="11" font-weight="bold" fill="#1E40AF">第3章 线性模型：w^T x + b</text>
  <text x="52" y="210" font-size="10" fill="#334155">超平面切分、对数几率回归、LDA投影</text>
  <rect x="42" y="228" width="216" height="44" rx="5" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="52" y="246" font-size="11" font-weight="bold" fill="#1E40AF">第4/8章 树与集成：Σ α_m h_m(x)</text>
  <text x="52" y="262" font-size="10" fill="#334155">正交轴分箱、Bagging降方差、Boosting降偏差</text>
  <rect x="42" y="280" width="216" height="44" rx="5" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="52" y="298" font-size="11" font-weight="bold" fill="#1E40AF">第6章 支持向量机：⟨w, φ(x)⟩</text>
  <text x="52" y="314" font-size="10" fill="#334155">再生核希尔伯特空间升维、最大间隔边界</text>
  <rect x="42" y="332" width="216" height="58" rx="5" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="52" y="350" font-size="11" font-weight="bold" fill="#1E3A8A">第5章 神经网络：σ(W_L ... σ(W_1 x))</text>
  <text x="52" y="366" font-size="10" fill="#334155">端到端可微流形揉折：从手工特征工程</text>
  <text x="52" y="380" font-size="10" fill="#334155">跃迁至自动表示学习 (Representation)</text>

  <!-- Pillar 2: Loss & Probabilistic Prior -->
  <rect x="288" y="134" width="244" height="272" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="410" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">2. 损失函数 ℓ 与概率先验</text>
  <rect x="302" y="176" width="216" height="52" rx="5" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="312" y="194" font-size="11" font-weight="bold" fill="#047857">0-1 损失的非凸光滑替代</text>
  <text x="312" y="210" font-size="10" fill="#334155">• Hinge损失 (SVM)：零梯度安全间隔带</text>
  <text x="312" y="224" font-size="10" fill="#334155">• 交叉熵 (Logistic)：输出严格校准为概率</text>
  <rect x="302" y="236" width="216" height="52" rx="5" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="312" y="254" font-size="11" font-weight="bold" fill="#047857">噪声分布 ⇔ 回归损失等价性</text>
  <text x="312" y="270" font-size="10" fill="#334155">• 高斯噪声 MLE ⇔ L2 均方误差 (均值解)</text>
  <text x="312" y="284" font-size="10" fill="#334155">• 拉普拉斯 MLE ⇔ L1 绝对误差 (中位数解)</text>
  <rect x="302" y="296" width="216" height="94" rx="5" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="312" y="316" font-size="11" font-weight="bold" fill="#065F46">第7/11/14章 先验与特征稀疏</text>
  <text x="312" y="334" font-size="10" fill="#334155">• L2 权重衰减 ⇔ 参数服从高斯先验</text>
  <text x="312" y="350" font-size="10" fill="#334155">• L1 Lasso 正则 ⇔ 拉普拉斯先验 (稀疏顶点)</text>
  <text x="312" y="366" font-size="10" fill="#334155">• 判别式 P(Y|X) vs. 生成式 P(X,Y)</text>
  <text x="312" y="382" font-size="10" fill="#334155">  (朴素贝叶斯 → GMM → 隐马尔可夫/图模型)</text>

  <!-- Pillar 3: Latent Structure & Unsupervised -->
  <rect x="548" y="134" width="244" height="272" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="670" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">3. 隐变量、流形与弱监督</text>
  <rect x="562" y="176" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="572" y="196" font-size="11" font-weight="bold" fill="#B45309">第9章 聚类与 EM 坐标上升</text>
  <text x="572" y="214" font-size="10" fill="#334155">当标签 Z 不可见时：E 步算软后验 γ_ij，</text>
  <text x="572" y="230" font-size="10" fill="#334155">M 步最大化证据下界 ELBO (通向 VAE)</text>
  <rect x="562" y="248" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="572" y="268" font-size="11" font-weight="bold" fill="#B45309">第10章 降维与流形学习</text>
  <text x="572" y="286" font-size="10" fill="#334155">维数灾难与本征低维流形：PCA正交最大方差、</text>
  <text x="572" y="302" font-size="10" fill="#334155">MDS保距、Isomap测地线距离、LLE局部线性</text>
  <rect x="562" y="320" width="216" height="70" rx="5" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="572" y="340" font-size="11" font-weight="bold" fill="#92400E">第13/16章 半监督与强化学习</text>
  <text x="572" y="358" font-size="10" fill="#334155">• 利用未标记样本的聚类/流形分布先验</text>
  <text x="572" y="376" font-size="10" fill="#334155">• 延迟奖励下的 MDP 贝尔曼最优方程</text>

  <!-- Pillar 4: Optimization & Generalization -->
  <rect x="808" y="134" width="244" height="272" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="930" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#9F1239">4. 求解优化与泛化边界</text>
  <rect x="822" y="176" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#FECDD3"/>
  <text x="832" y="196" font-size="11" font-weight="bold" fill="#BE123C">解析闭式解 vs. 迭代梯度流</text>
  <text x="832" y="214" font-size="10" fill="#334155">• 矩阵求逆 O(d³)：正规方程 / PCA特征分解</text>
  <text x="832" y="230" font-size="10" fill="#334155">• 凸二次规划：SMO 序列最小优化 (SVM)</text>
  <rect x="822" y="248" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#FECDD3"/>
  <text x="832" y="268" font-size="11" font-weight="bold" fill="#BE123C">自动微分与随机梯度下降</text>
  <text x="832" y="286" font-size="10" fill="#334155">动态计算图反向模式 AD (VJP) + 小批量</text>
  <text x="832" y="302" font-size="10" fill="#334155">梯度噪声逃离鞍点与尖锐极小值</text>
  <rect x="822" y="320" width="216" height="70" rx="5" fill="#FFE4E6" stroke="#F43F5E"/>
  <text x="832" y="340" font-size="11" font-weight="bold" fill="#9F1239">第1/2/12章 泛化理论与评估</text>
  <text x="832" y="358" font-size="10" fill="#334155">• NFL没有免费午餐定理 ⇔ 归纳偏置必要性</text>
  <text x="832" y="376" font-size="10" fill="#334155">• VC维 / Rademacher复杂度 → 双下降现象</text>
</svg>