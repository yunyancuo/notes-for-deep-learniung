<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="410" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 7：《西瓜书》第 7/9/14 章隐变量与 EM 算法：证据下界（ELBO）交替坐标上升图解</text>

  <!-- Left: Why MLE fails with latent Z & ELBO decomposition -->
  <rect x="28" y="56" width="500" height="330" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="278" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">1. 为什么含隐变量 Z 时不能直接求导？（对数里套求和的死结）</text>

  <rect x="48" y="98" width="460" height="132" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="64" y="120" font-size="11" fill="#334155">当每个样本属于哪个高斯簇 z_i ∈ {1..K} 未知时，观测数据的对数边缘似然为：</text>
  <text x="278" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#B91C1C">log P(X | θ) = Σ_i log [ Σ_z P(x_i, z | θ) ]   ← log 里面卡着求和 Σ_z，求导无闭式解！</text>
  <text x="64" y="170" font-size="11" fill="#334155">引入任意辅助分布 q(z) 后，对任意 θ 恒有如下恒等分解（西瓜书 7.6 / 14.5 节核心）：</text>
  <text x="278" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#1E40AF">log P(X | θ) = ELBO(q, θ)  +  KL( q(Z) || P(Z | X, θ) )</text>
  <text x="64" y="218" font-size="11" fill="#047857">因为 KL 散度恒 ≥ 0，所以 ELBO(q, θ) 是真实对数似然的一个严密下界（Lower Bound）！</text>

  <rect x="48" y="242" width="460" height="130" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="64" y="264" font-size="12" font-weight="bold" fill="#1E3A8A">EM 算法的两步“搭桥攀岩术”（Coordinate Ascent on ELBO）：</text>
  <text x="64" y="286" font-size="11" fill="#334155">• E 步 (固定 θ^{(t)}，优化 q)：令 q(Z) = P(Z | X, θ^{(t)})，此时 KL 散度精准归零，</text>
  <text x="76" y="304" font-size="11" fill="#1D4ED8">下界曲线 ELBO 在当前点 θ^{(t)} 与真实似然曲线紧紧相切（把求和号移到了 log 外面！）</text>
  <text x="64" y="326" font-size="11" fill="#334155">• M 步 (固定 q，优化 θ)：在光滑凹函数下界 Q(θ, θ^{(t)}) 上直接求导攀升至最高峰 θ^{(t+1)}，</text>
  <text x="76" y="346" font-size="11" fill="#15803D" font-weight="bold">保证真实似然单调不减：log P(X | θ^{(t+1)}) ≥ log P(X | θ^{(t)})</text>

  <!-- Right: Visual Curve + Connection to K-Means and VAE -->
  <rect x="552" y="56" width="500" height="330" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="802" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">2. 从 K-Means 硬聚类、GMM 软聚类到现代 VAE（变分自编码器）</text>

  <rect x="572" y="98" width="460" height="132" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <!-- Curve illustration -->
  <path d="M 600 205 Q 720 115 990 125" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  <text x="920" y="118" font-size="11" font-weight="bold" fill="#0F172A">真实似然 log P(X|θ)</text>
  <path d="M 610 218 Q 700 154 820 205" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="665" y="218" font-size="10" fill="#1D4ED8">第 t 轮下界 ELBO(q_t, θ)</text>
  <circle cx="678" cy="172" r="4.5" fill="#2563EB"/>
  <circle cx="722" cy="176" r="4.5" fill="#16A34A"/>
  <line x1="722" y1="176" x2="722" y2="152" stroke="#16A34A" stroke-width="2"/>
  <circle cx="722" cy="152" r="4.5" fill="#DC2626"/>
  <text x="805" y="166" font-size="10" font-weight="bold" fill="#047857">E步消除KL间隙 → M步爬向峰顶</text>

  <rect x="572" y="242" width="460" height="130" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="588" y="264" font-size="12" font-weight="bold" fill="#065F46">一脉相承的三代隐变量模型谱系：</text>
  <text x="588" y="286" font-size="11" fill="#334155">1. K-Means (西瓜书 9.4.1)：各簇协方差固定为 εI 且 ε→0 时的极限特例（后验退化为 0/1 硬指派）</text>
  <text x="588" y="308" font-size="11" fill="#334155">2. 高斯混合模型 GMM (西瓜书 9.4.3)：精确计算离散隐变量后验 γ_{ji} = P(z_i=j | x_i) 的标准 EM</text>
  <text x="588" y="330" font-size="11" fill="#334155">3. 变分自编码器 VAE (Kingma &amp; Welling, 2014)：当隐变量 z 是连续高维向量且真实后验不可积时，</text>
  <text x="588" y="350" font-size="11" fill="#047857" font-weight="bold">   用编码器神经网络 q_φ(z|x) 摊销推断 (Amortized E-step)，通过重参数化技巧联合梯度上升！</text>
</svg>