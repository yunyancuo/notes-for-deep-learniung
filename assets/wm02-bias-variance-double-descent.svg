<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="410" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 2：从《西瓜书》第 2 章经典“偏差-方差权衡”到现代深度学习“双下降曲线 (Double Descent)”</text>

  <!-- Left: Classical Regime -->
  <rect x="28" y="56" width="500" height="330" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="278" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">1. 经典欠参数化区域 (Under-Parameterized Regime)</text>
  
  <rect x="48" y="98" width="460" height="170" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <line x1="88" y1="240" x2="478" y2="240" stroke="#64748B" stroke-width="1.5"/>
  <line x1="88" y1="240" x2="88" y2="112" stroke="#64748B" stroke-width="1.5"/>
  <text x="283" y="258" text-anchor="middle" font-size="10" fill="#475569">模型容量 / 假设空间复杂度 d_VC</text>
  <text x="78" y="124" text-anchor="end" font-size="10" fill="#475569">误差</text>
  <!-- Bias^2 curve -->
  <path d="M 100 125 Q 220 215 460 232" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="415" y="224" font-size="10" fill="#1D4ED8">Bias² (偏差)</text>
  <!-- Variance curve -->
  <path d="M 100 234 Q 280 220 460 126" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="415" y="122" font-size="10" fill="#B45309">Var (方差)</text>
  <!-- Total U-curve -->
  <path d="M 100 120 Q 260 245 460 118" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <text x="265" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">测试集总泛化误差 E(f;D)</text>
  <line x1="265" y1="176" x2="265" y2="240" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="265" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803D">经典甜点区</text>

  <rect x="48" y="278" width="460" height="94" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="62" y="298" font-size="12" font-weight="bold" fill="#1E3A8A">西瓜书 2.5 节核心分解式：E(f; D) = Bias²(x) + Var(x) + ε²</text>
  <text x="62" y="318" font-size="11" fill="#334155">• 偏差 Bias：期望预测与真实规律的偏离，刻画学习算法本身的拟合能力</text>
  <text x="62" y="338" font-size="11" fill="#334155">• 方差 Var：训练集轻微变动引发的预测摇摆，刻画对采样噪声的敏感度</text>
  <text x="62" y="358" font-size="11" fill="#334155">• 经典推论：当参数量接近样本数 (P ≈ N) 时，模型死记硬背噪声，方差暴涨</text>

  <!-- Right: Modern Double Descent -->
  <rect x="552" y="56" width="500" height="330" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="802" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">2. 现代过参数化双下降 (Over-Parameterized Double Descent)</text>

  <rect x="572" y="98" width="460" height="170" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <line x1="608" y1="240" x2="1008" y2="240" stroke="#64748B" stroke-width="1.5"/>
  <line x1="608" y1="240" x2="608" y2="112" stroke="#64748B" stroke-width="1.5"/>
  <!-- Interpolation Threshold Line -->
  <line x1="780" y1="112" x2="780" y2="240" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="780" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">插值阈值 (P ≈ N, 训练误差=0)</text>
  <!-- Double Descent Curve -->
  <path d="M 620 135 Q 690 218 730 195 Q 765 160 780 128 Q 815 215 990 228" fill="none" stroke="#059669" stroke-width="2.5"/>
  <!-- Training Error -->
  <path d="M 620 148 Q 710 225 780 238 L 990 238" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="675" y="232" font-size="10" fill="#475569">训练误差 → 0</text>
  <text x="905" y="216" font-size="11" font-weight="bold" fill="#047857">第二次下降 (最小范数光滑插值)</text>

  <rect x="572" y="278" width="460" height="94" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="586" y="298" font-size="12" font-weight="bold" fill="#065F46">为什么几亿参数的深度网络不仅不炸方差，反而泛化更好？</text>
  <text x="586" y="318" font-size="11" fill="#334155">• 在 P = N 临界点：能刚好完美穿过所有训练点的解只有唯一一个，被迫剧烈震荡</text>
  <text x="586" y="338" font-size="11" fill="#334155">• 当 P ≫ N 时：零训练误差解构成高维流形，SGD 隐式正则化自动收敛向</text>
  <text x="586" y="358" font-size="11" fill="#047857" font-weight="bold">  最小 L2 范数 / 最平坦曲率解（奧卡姆剃刀从“限制参数个数”变为“限制函数范数”）</text>
</svg>