    <text x="255" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#065F46">② 橡皮筋橘猫（EM算法）：顺着瓜堆形状把橡皮筋拉长变扁！</text>

    <rect x="30" y="72" width="400" height="142" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
