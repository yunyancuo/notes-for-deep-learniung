  <text x="100" y="42" font-size="14.5" font-weight="bold" fill="#92400E">团子问：“师傅，如果遇到特别难的大事，一个人拿不准，找一群人一起商量（集成学习）怎么配合最聪明？”</text>
  <polygon points="919,45 917,27 933,37" fill="#FB923C" stroke="#9A3412" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="957,45 959,27 943,37" fill="#FB923C" stroke="#9A3412" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="921,43 920,31 930,38" fill="#FDBA74"/>
