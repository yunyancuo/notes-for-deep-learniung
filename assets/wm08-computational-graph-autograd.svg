<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="410" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 8：从《西瓜书》第 5 章 BP 链式法则到 PyTorch 动态计算图（Reverse-Mode Autograd）</text>

  <!-- Top: Forward & Backward Graph -->
  <rect x="28" y="56" width="1024" height="168" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="540" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">1. 动态计算图双通道执行：前向传播缓存中间激活值 vs. 反向传播传递伴随向量 (VJP)</text>

  <!-- Nodes -->
  <rect x="64" y="108" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="134" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E40AF">输入与参数 (x, W₁)</text>
  <text x="134" y="150" text-anchor="middle" font-size="10" fill="#475569">requires_grad=True</text>

  <text x="242" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">── 前向 z₁=W₁x ──►</text>
  <text x="242" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">◄── 反向 ∂L/∂W₁ ──</text>

  <rect x="284" y="108" width="168" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="368" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">算子 1: 仿射 + ReLU</text>
  <text x="368" y="150" text-anchor="middle" font-size="10" fill="#B45309">显存必须缓存: x 与掩码 (z₁&gt;0)</text>

  <text x="492" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">── 前向 a₁=σ(z₁) ──►</text>
  <text x="492" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">◄── 反向 v̄₁=v̄₂·J₂ ──</text>

  <rect x="536" y="108" width="168" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">算子 2: 线性层 z₂=W₂a₁</text>
  <text x="620" y="150" text-anchor="middle" font-size="10" fill="#B45309">显存必须缓存: 激活值 a₁</text>

  <text x="744" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">── 前向 z₂ ──►</text>
  <text x="744" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">◄── v̄₂=ŷ-y ──</text>

  <rect x="784" y="108" width="236" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="902" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803D">标量损失 L = CrossEntropy(z₂, y)</text>
  <text x="902" y="150" text-anchor="middle" font-size="10" fill="#065F46">起点伴随灵敏度 L̄ = ∂L/∂L = 1.0</text>

  <text x="540" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">关键洞见：反向传播从不显式构造巨大的雅可比矩阵 J ∈ R^(m×n)，而是直接计算向量-雅可比积 (VJP)：v̄_in = v̄_out^T · J</text>

  <!-- Bottom Left: Why Reverse Mode vs Forward Mode -->
  <rect x="28" y="240" width="500" height="148" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="278" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">2. 为什么深度学习只用反向模式 AD (Reverse-Mode)？</text>
  <text x="48" y="292" font-size="11" fill="#334155">• 映射维度：神经网络是 R^P → R¹ 的极端多对一映射（参数 P=10⁸，输出损失标量 m=1）</text>
  <text x="48" y="314" font-size="11" fill="#334155">• 前向模式 AD (JVP)：每跑 1 次前向しか能算出对 1 个参数的导数，算 1 亿参数需跑 1 亿遍！</text>
  <text x="48" y="336" font-size="11" fill="#92400E" font-weight="bold">• 反向模式 AD (VJP)：从唯一的标量输出 L 出发往回传 1 遍，O(1) 次遍历算出全部 1 亿个梯度！</text>
  <text x="48" y="358" font-size="11" fill="#334155">• 代价：前向算出的所有层激活值 a_l 必须留在 GPU 显存里等反向传播用完才能释放</text>

  <!-- Bottom Right: PyTorch Autograd Pitfalls (from user's notebook) -->
  <rect x="552" y="240" width="500" height="148" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="802" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">3. 对应本仓库《自动求导笔记.ipynb》的四大高频工程机制</text>
  <text x="572" y="292" font-size="11" fill="#334155">1. 为什么 backward() 后计算图默认销毁？为立即释放前向缓存的巨量激活值显存</text>
  <text x="572" y="314" font-size="11" fill="#334155">2. 为什么必须 optimizer.zero_grad()？PyTorch 默认累加梯度 (grad += new_grad)，</text>
  <text x="588" y="332" font-size="11" fill="#047857">这并非设计缺陷，而是为了方便小显存机器做梯度累积 (Gradient Accumulation)</text>
  <text x="572" y="354" font-size="11" fill="#334155">3. detach() 的图论含义：斩断当前张量向祖先节点的 grad_fn 回传边，将其变为常数叶子</text>
</svg>