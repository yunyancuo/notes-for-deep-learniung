<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="420" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 4：《西瓜书》四大核心算法流派的空间切分与流形变换几何直觉</text>

  <!-- 1. Linear Model -->
  <rect x="24" y="56" width="246" height="340" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="147" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">1. 线性模型 (第3章)</text>
  <text x="147" y="102" text-anchor="middle" font-size="11" fill="#1D4ED8">“刚性直尺一刀切”</text>
  <rect x="44" y="116" width="206" height="120" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <line x1="56" y1="216" x2="236" y2="136" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="90" cy="150" r="6" fill="#EF4444"/><circle cx="120" cy="145" r="6" fill="#EF4444"/>
  <circle cx="170" cy="200" r="6" fill="#10B981"/><circle cx="205" cy="190" r="6" fill="#10B981"/>
  <text x="44" y="260" font-size="11" fill="#334155">• 归纳偏置：类别由单一超平面</text>
  <text x="44" y="278" font-size="11" fill="#334155">  w^T x + b = 0 线性可分</text>
  <text x="44" y="300" font-size="11" fill="#334155">• LDA 视角：最大化类间散度 S_b</text>
  <text x="44" y="318" font-size="11" fill="#334155">  同时最小化类内散度 S_w</text>
  <text x="44" y="340" font-size="11" fill="#B91C1C">• 局限：无法表达异或 (XOR) 等</text>
  <text x="44" y="358" font-size="11" fill="#B91C1C">  非单调交互特征</text>

  <!-- 2. Decision Tree -->
  <rect x="286" y="56" width="246" height="340" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="409" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">2. 决策树与森林 (第4/8章)</text>
  <text x="409" y="102" text-anchor="middle" font-size="11" fill="#B45309">“平行于坐标轴的阶梯网格”</text>
  <rect x="306" y="116" width="206" height="120" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>
  <line x1="396" y1="116" x2="396" y2="236" stroke="#D97706" stroke-width="2"/>
  <line x1="396" y1="176" x2="512" y2="176" stroke="#D97706" stroke-width="2"/>
  <line x1="306" y1="196" x2="396" y2="196" stroke="#D97706" stroke-width="2"/>
  <text x="350" y="156" text-anchor="middle" font-size="10" fill="#92400E">R₁: y=+1</text>
  <text x="454" y="148" text-anchor="middle" font-size="10" fill="#15803D">R₂: y=-1</text>
  <text x="454" y="210" text-anchor="middle" font-size="10" fill="#92400E">R₃: y=+1</text>
  <text x="306" y="260" font-size="11" fill="#334155">• 归纳偏置：特征空间可递归切分为</text>
  <text x="306" y="278" font-size="11" fill="#334155">  轴平行超矩形 (Axis-Aligned Boxes)</text>
  <text x="306" y="300" font-size="11" fill="#15803D">• 优势：对特征单调缩放完全不变，</text>
  <text x="306" y="318" font-size="11" fill="#15803D">  天然擅长异构表格数据 (Tabular)</text>
  <text x="306" y="340" font-size="11" fill="#B91C1C">• 局限：拟合 45° 斜线需无数碎阶梯，</text>
  <text x="306" y="358" font-size="11" fill="#B91C1C">  且无法向训练取值范围外做趋势外推</text>

  <!-- 3. Kernel SVM -->
  <rect x="548" y="56" width="246" height="340" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="671" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">3. 核支持向量机 (第6章)</text>
  <text x="671" y="102" text-anchor="middle" font-size="11" fill="#047857">“把桌面拍起，在更高维一刀切”</text>
  <rect x="568" y="116" width="206" height="120" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <ellipse cx="671" cy="176" rx="48" ry="32" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <ellipse cx="671" cy="176" rx="62" ry="42" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="671" cy="176" r="5" fill="#047857"/><circle cx="655" cy="170" r="5" fill="#047857"/>
  <circle cx="605" cy="140" r="5" fill="#EF4444"/><circle cx="735" cy="210" r="5" fill="#EF4444"/>
  <text x="568" y="260" font-size="11" fill="#334155">• 归纳偏置：局部平滑性 + 固定核</text>
  <text x="568" y="278" font-size="11" fill="#334155">  函数 κ(x, x') 诱导的希尔伯特空间</text>
  <text x="568" y="300" font-size="11" fill="#15803D">• 优势：凸优化全局唯一最优解，</text>
  <text x="568" y="318" font-size="11" fill="#15803D">  解仅依赖边界上的稀疏支持向量</text>
  <text x="568" y="340" font-size="11" fill="#B91C1C">• 局限：核矩阵 K ∈ R^(N×N) 存储与</text>
  <text x="568" y="358" font-size="11" fill="#B91C1C">  求逆开销 O(N³)，样本超10万即瓶颈</text>

  <!-- 4. Deep Neural Network -->
  <rect x="810" y="56" width="246" height="340" rx="10" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="933" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#581C87">4. 深度神经网络 (第5章→DL)</text>
  <text x="933" y="102" text-anchor="middle" font-size="11" fill="#6B21A8">“扭曲空间的连续揉纸与展平术”</text>
  <rect x="830" y="116" width="206" height="120" rx="6" fill="#FFFFFF" stroke="#E9D5FF"/>
  <path d="M 850 205 C 885 125, 925 225, 960 140" fill="none" stroke="#9333EA" stroke-width="2"/>
  <text x="975" y="180" font-size="12" font-weight="bold" fill="#6B21A8">⇒</text>
  <line x1="995" y1="135" x2="995" y2="215" stroke="#16A34A" stroke-width="2.5"/>
  <text x="933" y="230" text-anchor="middle" font-size="10" fill="#581C87">前面 L-1 层把缠绕流形拉开，最后一层线性切分</text>
  <text x="830" y="260" font-size="11" fill="#334155">• 归纳偏置：层次化组合表征 + ReLU</text>
  <text x="830" y="278" font-size="11" fill="#334155">  连续分段线性胞腔指数级折叠</text>
  <text x="830" y="300" font-size="11" fill="#15803D">• 优势：与任务联合学习特征映射 φ_θ，</text>
  <text x="830" y="318" font-size="11" fill="#15803D">  SGD 支持亿级样本 O(N) 流式扩展</text>
  <text x="830" y="340" font-size="11" fill="#B91C1C">• 代价：非凸优化景观、需架构归纳</text>
  <text x="830" y="358" font-size="11" fill="#B91C1C">  偏置（CNN平移不变 / Attention置换等变）</text>
</svg>