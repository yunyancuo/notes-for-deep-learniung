name: Repository Quality & Integrity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Tests & Frontend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification tools
        run: python -m pip install --upgrade pip pytest ruff nbformat

      - name: Lint Python scripts and tests with Ruff
        run: ruff check experiments tests

      - name: Run repository integrity test suite
        run: pytest -v

      - name: Verify inline JavaScript syntax with Node.js
        run: |
          python - <<'PY'
          import pathlib, subprocess, tempfile
          from html.parser import HTMLParser

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.in_script = True
                      self.buf = []
              def handle_data(self, data):
                  if self.in_script:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.scripts.append("".join(self.buf))
                      self.in_script = False

          parser = ScriptExtractor()
          parser.feed(pathlib.Path("index.html").read_text(encoding="utf-8"))
          assert parser.scripts, "No inline scripts found in index.html"
          for idx, code in enumerate(parser.scripts):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as tmp:
                  tmp.write(code)
                  tmp.flush()
                  subprocess.run(["node", "--check", tmp.name], check=True)
                  print(f"Inline script #{idx}: syntax OK")
          PY
