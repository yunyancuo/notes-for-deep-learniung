<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="410" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 5：《西瓜书》第 6 章支持向量机（SVM）：拉格朗日对偶、KKT 互补松弛与核技巧本质</text>

  <!-- Left: Primal vs Dual & KKT Sparsity -->
  <rect x="28" y="56" width="500" height="330" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="278" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">1. 为什么 SVM 的解极其稀疏？（KKT 互补松弛的物理直觉）</text>

  <rect x="48" y="98" width="460" height="136" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="64" y="120" font-size="12" font-weight="bold" fill="#1E40AF">原始问题 (Primal，参数维数 d)  ⇔  对偶问题 (Dual，样本数 N)：</text>
  <text x="64" y="142" font-family="Consolas, monospace" font-size="11" fill="#0F172A">min_{w,b} ½||w||²  s.t. 1 - y_i(w^T x_i + b) ≤ 0</text>
  <text x="64" y="162" font-family="Consolas, monospace" font-size="11" fill="#1D4ED8">max_α Σ α_i - ½ Σ_i Σ_j α_i α_j y_i y_j ⟨x_i, x_j⟩  (α_i ≥ 0)</text>
  <text x="64" y="186" font-size="12" font-weight="bold" fill="#B91C1C">核心 KKT 互补松弛条件 (Complementary Slackness)：</text>
  <text x="64" y="206" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#991B1B">α_i · [ y_i (w^T x_i + b) - 1 ] = 0</text>
  <text x="64" y="224" font-size="11" fill="#334155">这两项乘积必为 0！直接导出支持向量的稀疏定理：</text>

  <rect x="48" y="246" width="460" height="126" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="64" y="268" font-size="11" fill="#334155">• 情况 A（内部安全样本）：y_i(w^T x_i + b) &gt; 1，括号项非零 ⇒ 必有 α_i = 0！</text>
  <text x="76" y="286" font-size="11" fill="#64748B">哪怕把远离边界的 99% 样本全部删掉或随意移动，分类超平面连 1 毫米都不会动。</text>
  <text x="64" y="310" font-size="11" fill="#15803D" font-weight="bold">• 情况 B（压在间隔边界上的样本）：y_i(w^T x_i + b) = 1 ⇒ 允许 α_i &gt; 0（支持向量）</text>
  <text x="64" y="332" font-size="11" fill="#334155">• 最优法向量合成公式：w* = Σ_{i ∈ SV} α_i y_i x_i（超平面仅由极少数边界点张成）</text>
  <text x="64" y="354" font-size="11" fill="#1E40AF" font-weight="bold">• 对比 Logistic 回归：用 Sigmoid 损失时所有样本权重均非零，故无稀疏性</text>

  <!-- Right: Kernel Trick & Mercer Theorem -->
  <rect x="552" y="56" width="500" height="330" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="802" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">2. 核技巧 (Kernel Trick)：为什么不用显式算出无穷维坐标 φ(x)？</text>

  <rect x="572" y="98" width="460" height="136" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="588" y="122" font-size="12" font-weight="bold" fill="#047857">对偶问题的精妙之处：数据 x 只以成对内积 ⟨x_i, x_j⟩ 的形式出现！</text>
  <text x="588" y="146" font-size="11" fill="#334155">若显式将 x ∈ R^d 映射到高维 φ(x) ∈ R^D 再算内积，当 D → ∞ 时计算直接崩溃。</text>
  <text x="588" y="168" font-size="11" fill="#065F46" font-weight="bold">核技巧走了一条捷径：直接在原低维空间计算核函数 κ(x_i, x_j) = ⟨φ(x_i), φ(x_j)⟩</text>
  <text x="588" y="192" font-size="11" fill="#334155">以高斯径向基核 (RBF Kernel) 为例，利用泰勒级数展开：</text>
  <text x="588" y="214" font-family="Consolas, monospace" font-size="11" fill="#047857">exp(-γ||x - z||²) = exp(-γ||x||²)exp(-γ||z||²) · Σ_{k=0}^∞ [ (2γ)^k / k! ] ⟨x, z⟩^k</text>

  <rect x="572" y="246" width="460" height="126" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="588" y="268" font-size="12" font-weight="bold" fill="#065F46">从核方法到现代深度学习的桥梁（Representers &amp; NTK）：</text>
  <text x="588" y="290" font-size="11" fill="#334155">• RBF 核隐式对应无穷阶多项式内积，故在有限样本上具备无穷 VC 维</text>
  <text x="588" y="312" font-size="11" fill="#334155">• 传统核方法的短板：核函数 κ(·,·) 是人类手工固定的，不随任务数据自适应调整</text>
  <text x="588" y="334" font-size="11" fill="#334155">• 深度神经网络的超越：相当于用前 L-1 层可训练参数 θ 动态学习一个任务专属核</text>
  <text x="588" y="354" font-size="11" fill="#047857" font-weight="bold">  κ_θ(x, z) = ⟨φ_θ(x), φ_θ(z)⟩（无限宽网络极限即神经正切核 Neural Tangent Kernel）</text>
</svg>