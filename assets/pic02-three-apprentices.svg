<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="400" rx="22" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
  <rect x="24" y="18" width="952" height="46" rx="14" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
  <text x="500" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#0369A1">第 2 页：三只小猫学挑瓜（为什么死记硬背的奶牛猫反而考砸了？）</text>

  <!-- 1. 蓝猫小呆 (欠拟合) -->
  <g transform="translate(28, 80)">
    <rect width="296" height="296" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="40,38 38,18 54,29" fill="#94A3B8" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="80,38 82,18 66,29" fill="#94A3B8" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="42,35 41,23 52,30" fill="#FDA4AF"/>
<polygon points="78,35 79,23 68,30" fill="#FDA4AF"/>
<circle cx="60" cy="48" r="24" fill="#94A3B8" stroke="#334155" stroke-width="2.5"/>
<line x1="60" y1="27" x2="60" y2="35" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
<line x1="53" y1="29" x2="55" y2="34" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
